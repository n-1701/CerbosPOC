---
apiVersion: api.cerbos.dev/v1
derivedRoles:
  name: "common_roles"
  definitions:

    # Matches when the logged-in user is the one who created the resource
    - name: "owner"
      parentRoles: ["user", "manager"]
      condition:
        match:
          expr: "resource.attr.ownerId == principal.id"

    # Matches when a manager is in the same department as the resource
    - name: "dept_manager"
      parentRoles: ["manager"]
      condition:
        match:
          expr: "principal.attr.department == resource.attr.department"
